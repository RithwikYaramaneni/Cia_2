name: Attendify CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - testing
          - production
        default: testing

env:
  VM_HOST: ${{ vars.VM_HOST }}
  VM_USERNAME: ${{ vars.VM_USERNAME }}
  DEPLOY_ENV: ${{ inputs.target_environment || 'production' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cia_2
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test and package
        run: mvn -B verify
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: attendify-jar
          path: Cia_2/target/attendify-0.0.1-SNAPSHOT.jar

  deploy:
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.target_environment || 'production' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: attendify-jar
          path: artifact
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      - name: Trust VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Upload and restart Attendify
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENV" = "production" ]; then
            remote_jar="/home/$VM_USERNAME/attendify.jar"
            service_name="attendify"
            service_port="8080"
          else
            remote_jar="/home/$VM_USERNAME/attendify-testing.jar"
            service_name="attendify-testing"
            service_port="8081"
          fi
          scp artifact/attendify-0.0.1-SNAPSHOT.jar \
            "$VM_USERNAME@$VM_HOST:$remote_jar"
          cat <<EOF | ssh "$VM_USERNAME@$VM_HOST" "sudo tee /etc/systemd/system/$service_name.service >/dev/null"
          [Unit]
          Description=Attendify $DEPLOY_ENV environment
          After=network.target

          [Service]
          User=$VM_USERNAME
          WorkingDirectory=/home/$VM_USERNAME
          ExecStart=/usr/bin/java -Xms128m -Xmx512m -jar $remote_jar --server.port=$service_port
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF
          ssh "$VM_USERNAME@$VM_HOST" \
            "sudo systemctl daemon-reload && sudo systemctl enable --now $service_name && sudo systemctl restart $service_name && sudo systemctl is-active --quiet $service_name"
      - name: Verify deployment
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            endpoint="http://$VM_HOST/api/dashboard"
          else
            endpoint="http://$VM_HOST:8081/api/dashboard"
          fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              "$endpoint" >/dev/null; then
              echo "Attendify $DEPLOY_ENV environment is responding at $endpoint"
              exit 0
            fi
            sleep 5
          done
          echo "Attendify endpoint did not become ready" >&2
          exit 1
