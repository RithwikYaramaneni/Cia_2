name: Attendify CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VM_HOST: ${{ vars.VM_HOST }}
  VM_USERNAME: ${{ vars.VM_USERNAME }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cia_2
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test and package
        run: mvn -B verify
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: attendify-jar
          path: Cia_2/target/attendify-0.0.1-SNAPSHOT.jar

  deploy:
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: attendify-jar
          path: artifact
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      - name: Trust VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Upload and restart Attendify
        run: |
          set -euo pipefail
          scp artifact/attendify-0.0.1-SNAPSHOT.jar \
            "$VM_USERNAME@$VM_HOST:/home/$VM_USERNAME/attendify.jar"
          ssh "$VM_USERNAME@$VM_HOST" \
            'sudo systemctl restart attendify && sudo systemctl is-active --quiet attendify'
      - name: Verify public endpoint
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              "http://$VM_HOST/api/dashboard" >/dev/null; then
              echo "Attendify is responding at http://$VM_HOST"
              exit 0
            fi
            sleep 5
          done
          echo "Attendify endpoint did not become ready" >&2
          exit 1
